[package]
name = "mikrotik-dondude"
version = "0.5.4"
edition = "2024"
rust-version = "1.94"
description = "Multi-tenant MikroTik RouterOS fleet manager with a web UI: Git-versioned configuration backups"
license = "GPL-3.0-or-later"
repository = "https://github.com/rimpianto/mikrotik.DonDude"
readme = "README.md"
keywords = ["mikrotik", "routeros", "backup", "git", "network-automation"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "dondude"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Native-dependency policy: everything is vendored and built from source so the
# binary does not need pkg-config, libgit2, libssh2 or OpenSSL on the host.
git2 = { version = "0.21.0", default-features = false, features = [
    "https",
    "ssh",
    "vendored-libgit2",
    "vendored-openssl",
] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["trace"] }
maud = "0.27.0"
argon2 = "0.5.3"
base64 = "0.23.1"
serde_json = "1.0.151"
chacha20poly1305 = "0.11.0"
getrandom = "0.4"
sha2 = "0.11.0"

[dev-dependencies]
git2 = { version = "0.21.0", default-features = false }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
