# Release pipeline: on a pushed tag (vX.Y.Z) the binaries and the container
# image are built by self-hosted runners (native arch, no QEMU), then a
# GitHub-hosted job merges the image manifests, publishes the multi-arch
# image to GHCR and creates the GitHub release with binaries + SHA256
# checksums and notes taken from CHANGELOG.md.
#
# The binaries and the container image are built by self-hosted runners on
# native machines (no QEMU emulation):
#   - one Linux ARM64 machine -> binaries aarch64 + image arm64
#   - one Linux X64 machine   -> binaries x86_64 + image amd64
#
# Note: the container repository name must be lowercase; the repo name
# ("mikrotik.DonDude") is not, so every reference lowercases it first.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            runs-on: [self-hosted, Linux, X64]
          - name: aarch64-unknown-linux-gnu
            runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      # Native build: the host C compiler is all the vendored C code
      # (libgit2/libssh2/OpenSSL) needs.
      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          dir="dondude-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/dondude "$dir/"
          cp README.md CHANGELOG.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.name }}
          path: |
            dondude-*.tar.gz
            dondude-*.sha256

  image-amd64:
    name: container image (linux/amd64)
    runs-on: [self-hosted, Linux, X64]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/rimpianto/mikrotik.dondude,push-by-digest=true,push=true

  image-arm64:
    name: container image (linux/arm64)
    runs-on: [self-hosted, Linux, ARM64]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/rimpianto/mikrotik.dondude,push-by-digest=true,push=true

  publish:
    name: publish release
    needs: [binaries, image-amd64, image-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bins-*
          merge-multiple: true

      - name: Merge multi-arch image and tag
        run: |
          image="ghcr.io/rimpianto/mikrotik.dondude"
          ver="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker buildx imagetools create \
            -t "$image:$ver" \
            -t "$image:${ver%.*}" \
            -t "$image:latest" \
            "$image@${{ needs.image-amd64.outputs.digest }}" \
            "$image@${{ needs.image-arm64.outputs.digest }}"

      # The release notes are the matching section of CHANGELOG.md, with
      # GitHub's commit list appended automatically.
      - name: Extract release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { inside=1; next }
            inside && /^## \[/ { inside=0 }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for $ver — falling back to generated notes."
            echo "See CHANGELOG.md for details." > notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          fail_on_unreleased_commits: false
          files: |
            dist/dondude-*.tar.gz
            dist/dondude-*.sha256
