# Release pipeline: on a pushed tag (vX.Y.Z) it builds the `dondude` binary
# for each Linux target, attaches binaries + SHA256 checksums to the GitHub
# release, and publishes a multi-arch container image to GHCR.
#
# Production update path: `docker compose pull && docker compose up -d`, or
# download the binary + checksums from the release page.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile prerequisites
        # libgit2/libssh2/OpenSSL are vendored and built from source; the arm64
        # build on an arm64 runner compiles them natively, so no cross tooling
        # is needed — only cmake/perl for the C parts.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake perl

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="dondude-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/dondude "$dir/"
          cp README.md CHANGELOG.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          # The vendored OpenSSL has no compiled-in certificate path; the binary
          # needs SSL_CERT_FILE (or the env var documented in the README) at
          # runtime, exactly like the container image.
          echo "Built $dir.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: |
            dondude-*.tar.gz
            dondude-*.sha256

  image:
    name: container image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bins-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unreleased_commits: false
          files: |
            dist/dondude-*.tar.gz
            dist/dondude-*.sha256
