# Release pipeline: on a pushed tag (vX.Y.Z) the binaries and the container
# image are built by self-hosted runners (native arch, no QEMU), then a
# GitHub-hosted job merges the image manifests, publishes the multi-arch
# image to GHCR and creates the GitHub release with binaries + SHA256
# checksums and notes taken from CHANGELOG.md.
#
# Runners (labels are the GitHub defaults for self-hosted runners):
#   - WSL Claude_IDF  (Linux ARM64) -> binaries aarch64 + image arm64
#   - lxc-dondude     (Linux X64)    -> binaries x86_64 + image amd64
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    name: binary (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            runs-on: [self-hosted, Linux, X64]
          - name: aarch64-unknown-linux-gnu
            runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      # Native build: the host C compiler is all the vendored C code
      # (libgit2/libssh2/OpenSSL) needs.
      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          dir="dondude-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/dondude "$dir/"
          cp README.md CHANGELOG.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.name }}
          path: |
            dondude-*.tar.gz
            dondude-*.sha256

  image:
    name: container image (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: [self-hosted, Linux, X64]
          - platform: linux/arm64
            runs-on: [self-hosted, Linux, ARM64]
    outputs:
      digest-amd64: ${{ steps.push.outputs.digest }}
      digest-arm64: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push each arch under a temporary tag; the publish job merges the
      # digests into the final multi-arch tags.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,push=true

  publish:
    name: publish release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bins-*
          merge-multiple: true

      - name: Merge multi-arch image and tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          image="ghcr.io/${{ env.IMAGE_NAME }}"
          ver="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$image:$ver" \
            -t "$image:${ver%.*}" \
            -t "$image:latest" \
            "$image@${{ needs.image.outputs.digest-amd64 }}" \
            "$image@${{ needs.image.outputs.digest-arm64 }}"

      # The release notes are the matching section of CHANGELOG.md, with
      # GitHub's commit list appended automatically.
      - name: Extract release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { inside=1; next }
            inside && /^## \[/ { inside=0 }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for $ver — falling back to generated notes."
            echo "See CHANGELOG.md for details." > notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          fail_on_unreleased_commits: false
          files: |
            dist/dondude-*.tar.gz
            dist/dondude-*.sha256
